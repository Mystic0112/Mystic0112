<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" role="img" aria-labelledby="t d"><title id="t">Ambiente de desenvolvimento</title><desc id="d">So: Linux, foco em produtividade; Containers: Docker para isolar ambiente; Metodologia: Clean Code e arquitetura modular; Versionamento: Git / GitHub.</desc><style>
.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{animation:rv 1s cubic-bezier(.2,.8,.2,1) 4.4s both}.up{animation-delay:4.4s}.bar{animation-delay:4.6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="899" height="209" rx="14" fill="#0d1117" stroke="#30363d"/><g class="rv"><rect class="bar" x="28" y="0" width="48" height="4" fill="#ff4b3e"/><text class="mono up" x="28" y="44" font-size="13" letter-spacing="2" fill="#9198a1">AMBIENTE DE DESENVOLVIMENTO</text><g class="up" style="animation-delay:4.50s"><text class="mono" x="28" y="86" font-size="12" letter-spacing="2" fill="#ff4b3e">SO</text><text class="sans" x="28" y="111" font-size="17" fill="#e6edf3">Linux, foco em produtividade</text></g><g class="up" style="animation-delay:4.56s"><text class="mono" x="464" y="86" font-size="12" letter-spacing="2" fill="#ff4b3e">CONTAINERS</text><text class="sans" x="464" y="111" font-size="17" fill="#e6edf3">Docker para isolar ambiente</text></g><g class="up" style="animation-delay:4.62s"><text class="mono" x="28" y="144" font-size="12" letter-spacing="2" fill="#ff4b3e">METODOLOGIA</text><text class="sans" x="28" y="169" font-size="17" fill="#e6edf3">Clean Code e arquitetura modular</text></g><g class="up" style="animation-delay:4.68s"><text class="mono" x="464" y="144" font-size="12" letter-spacing="2" fill="#ff4b3e">VERSIONAMENTO</text><text class="sans" x="464" y="169" font-size="17" fill="#e6edf3">Git / GitHub</text></g></g></svg>
