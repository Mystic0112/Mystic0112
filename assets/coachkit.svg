<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="t d"><title id="t">CoachKit</title><desc id="d">Privado. Sistema PHP/Laravel que usa IA como apoio à criação de treinos e dietas personalizados para o profissional. Stack: PHP, Laravel.</desc><style>
.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{animation:rv 1s cubic-bezier(.2,.8,.2,1) 2.0s both}.up{animation-delay:2.0s}.bar{animation-delay:2.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="899" height="199" rx="14" fill="#0d1117" stroke="#30363d"/><g class="rv"><rect class="bar" x="28" y="0" width="48" height="4" fill="#ff4b3e"/><text class="mono up" x="28" y="44" font-size="13" letter-spacing="2" fill="#9198a1"><tspan fill="#ff4b3e">03</tspan>  /  PRIVADO</text><text class="sans up" x="28" y="88" font-size="30" font-weight="800" fill="#e6edf3" style="animation-delay:2.10s">CoachKit</text><text class="sans up" x="28" y="124" font-size="17" fill="#b1bac4" style="animation-delay:2.18s">Sistema PHP/Laravel que usa IA como apoio à criação de</text><text class="sans up" x="28" y="148" font-size="17" fill="#b1bac4" style="animation-delay:2.23s">treinos e dietas personalizados para o profissional.</text><line x1="620" y1="28" x2="620" y2="172" stroke="#30363d"/><text class="mono up" x="648" y="44" font-size="13" letter-spacing="2" fill="#9198a1" style="animation-delay:2.20s">STACK</text><g class="up" style="animation-delay:2.30s"><rect x="648" y="62" width="49" height="30" rx="8" fill="#161b22" stroke="#30363d"/><text class="mono" x="660" y="82.0" font-size="14" fill="#e6edf3">PHP</text><rect x="707" y="62" width="83" height="30" rx="8" fill="#161b22" stroke="#30363d"/><text class="mono" x="719" y="82.0" font-size="14" fill="#e6edf3">Laravel</text></g><text class="mono up" x="648" y="166" font-size="14" letter-spacing="1" fill="#9198a1" style="animation-delay:2.40s">REPOSITÓRIO PRIVADO</text></g></svg>
