<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 76" role="img" aria-labelledby="t d"><title id="t">WhatsApp</title><desc id="d">Conversar pelo WhatsApp (conversar)</desc><style>
.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{animation:rv 1s cubic-bezier(.2,.8,.2,1) 6.6s both}.up{animation-delay:6.6s}.bar{animation-delay:6.8s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="899" height="75" rx="14" fill="#0d1117" stroke="#30363d"/><g class="rv"><text class="mono up" font-size="13" letter-spacing="2" fill="#9198a1" x="28" y="44.0">WHATSAPP</text><text class="sans up" x="236" y="44" font-size="18" fill="#e6edf3" style="animation-delay:6.68s">Conversar pelo WhatsApp</text><text class="mono up" x="872" y="43.0" text-anchor="end" font-size="13" letter-spacing="2" fill="#ff4b3e" style="animation-delay:6.76s">CONVERSAR →</text></g></svg>
