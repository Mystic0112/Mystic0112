<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" role="img" aria-labelledby="t d"><title id="t">Máquina de Shorts</title><desc id="d">Pipeline autônomo que escolhe o tema, escreve, confere os fatos, ilustra, narra e monta Shorts. Sem revisão humana, custo de API R$ 0.</desc><style>
.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="399" height="311" rx="14" fill="#0d1117" stroke="#30363d"/><rect class="bar" x="28" y="0" width="48" height="4" fill="#ff4b3e" style="animation-delay:0.2s"/><text class="mono up" x="28" y="48" font-size="13" letter-spacing="2" fill="#9198a1" style="animation-delay:0.0s">PÚBLICO</text><text class="sans up" x="28" y="88" font-size="27" font-weight="800" fill="#e6edf3" style="animation-delay:0.1s">Máquina de Shorts</text><text class="sans up" x="28" y="122" font-size="17" fill="#b1bac4" style="animation-delay:0.20s">Pipeline autônomo que escolhe o tema,</text><text class="sans up" x="28" y="146" font-size="17" fill="#b1bac4" style="animation-delay:0.25s">escreve, confere os fatos, ilustra,</text><text class="sans up" x="28" y="170" font-size="17" fill="#b1bac4" style="animation-delay:0.30s">narra e monta Shorts. Sem revisão</text><text class="sans up" x="28" y="194" font-size="17" fill="#b1bac4" style="animation-delay:0.35s">humana, custo de API R$ 0.</text><g class="up" style="animation-delay:0.5s"><rect x="28" y="216" width="108" height="30" rx="8" fill="#161b22" stroke="#30363d"/><text class="mono" x="40" y="236.0" font-size="14" fill="#e6edf3">TypeScript</text></g><g class="up" style="animation-delay:0.5s"><rect x="146" y="216" width="91" height="30" rx="8" fill="#161b22" stroke="#30363d"/><text class="mono" x="158" y="236.0" font-size="14" fill="#e6edf3">Remotion</text></g><line x1="28" y1="262" x2="372" y2="262" stroke="#30363d"/><text class="mono" x="28" y="288" font-size="14" fill="#ff4b3e">github.com/Mystic0112/Maquina-de-Shorts →</text></svg>
