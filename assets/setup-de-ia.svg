<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="t d"><title id="t">Setup de IA</title><desc id="d">Open source. O setup definitivo de IA: sai de iniciante e chega em usuário profissional de IA no fluxo de desenvolvimento. Stack: TypeScript, Claude.</desc><style>
.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="899" height="199" rx="14" fill="#0d1117" stroke="#30363d"/><rect class="bar" x="28" y="0" width="48" height="4" fill="#ff4b3e"/><text class="mono up" x="28" y="44" font-size="13" letter-spacing="2" fill="#9198a1"><tspan fill="#ff4b3e">02</tspan>  /  OPEN SOURCE</text><text class="sans up" x="28" y="88" font-size="30" font-weight="800" fill="#e6edf3" style="animation-delay:.1s">Setup de IA</text><text class="sans up" x="28" y="124" font-size="17" fill="#b1bac4" style="animation-delay:0.18s">O setup definitivo de IA: sai de iniciante e chega em</text><text class="sans up" x="28" y="148" font-size="17" fill="#b1bac4" style="animation-delay:0.23s">usuário profissional de IA no fluxo de desenvolvimento.</text><line x1="620" y1="28" x2="620" y2="172" stroke="#30363d"/><text class="mono up" x="648" y="44" font-size="13" letter-spacing="2" fill="#9198a1" style="animation-delay:0.2s">STACK</text><g class="up" style="animation-delay:.3s"><rect x="648" y="62" width="108" height="30" rx="8" fill="#161b22" stroke="#30363d"/><text class="mono" x="660" y="82.0" font-size="14" fill="#e6edf3">TypeScript</text><rect x="766" y="62" width="74" height="30" rx="8" fill="#161b22" stroke="#30363d"/><text class="mono" x="778" y="82.0" font-size="14" fill="#e6edf3">Claude</text></g><text class="mono up" x="648" y="166" font-size="14" letter-spacing="1" fill="#ff4b3e" style="animation-delay:.4s">VER REPOSITÓRIO →</text></svg>
