<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 378" role="img" aria-labelledby="t d"><title id="t">Sobre mim</title><desc id="d">Cursando o 4º período de Análise e Desenvolvimento de Sistemas na Uninassau, Campus PHB, formatura prevista para 2026. Backend em PHP e Laravel, integrações com IA e sistemas multi-serviços; buscando posição Júnior. Explorando: integrações com LLMs e MCP; Docker e Kubernetes; webhooks, sockets e arquiteturas multi-serviços; desenvolvimento e design com Claude; sites com efeitos parallax.</desc><style>
.sans{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) .2s backwards}
@keyframes rv{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{animation:rv 1s cubic-bezier(.2,.8,.2,1) 0.4s both}.up{animation-delay:0.4s}.bar{animation-delay:0.6s}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x=".5" y=".5" width="899" height="377" rx="14" fill="#0d1117" stroke="#30363d"/><g class="rv"><rect class="bar" x="28" y="0" width="48" height="4" fill="#ff4b3e"/><text class="sans up" x="28" y="56" font-size="18" fill="#b1bac4" style="animation-delay:0.50s">Cursando o 4º período de <tspan fill="#e6edf3" font-weight="600">Análise e Desenvolvimento de Sistemas</tspan></text><text class="sans up" x="28" y="82" font-size="18" fill="#b1bac4" style="animation-delay:0.56s">na <tspan fill="#e6edf3" font-weight="600">Uninassau | Campus PHB</tspan>, formatura prevista para 2026.</text><text class="sans up" x="28" y="120" font-size="18" fill="#b1bac4" style="animation-delay:0.62s">Trabalho com backend em <tspan fill="#e6edf3" font-weight="600">PHP e Laravel</tspan>, integrações com <tspan fill="#e6edf3" font-weight="600">Inteligência Artificial</tspan></text><text class="sans up" x="28" y="146" font-size="18" fill="#b1bac4" style="animation-delay:0.68s">e sistemas multi-serviços. Buscando posição <tspan fill="#e6edf3" font-weight="600">Júnior como Desenvolvedor Backend</tspan>.</text><line x1="28" y1="176" x2="872" y2="176" stroke="#30363d"/><text class="mono up" x="28" y="214" font-size="13" letter-spacing="2" fill="#9198a1" style="animation-delay:0.80s">EXPLORANDO</text><g class="up" style="animation-delay:0.90s"><rect x="28.0" y="232" width="157" height="118" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="44.0" y="264" font-size="12" letter-spacing="2" fill="#ff4b3e">IA</text><text class="sans" x="44.0" y="294" font-size="15" fill="#e6edf3">Integrações com</text><text class="sans" x="44.0" y="315" font-size="15" fill="#e6edf3">LLMs e MCP</text></g><g class="up" style="animation-delay:0.97s"><rect x="199.8" y="232" width="157" height="118" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="215.8" y="264" font-size="12" letter-spacing="2" fill="#ff4b3e">INFRA</text><text class="sans" x="215.8" y="294" font-size="15" fill="#e6edf3">Docker e</text><text class="sans" x="215.8" y="315" font-size="15" fill="#e6edf3">Kubernetes</text></g><g class="up" style="animation-delay:1.04s"><rect x="371.5" y="232" width="157" height="118" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="387.5" y="264" font-size="12" letter-spacing="2" fill="#ff4b3e">SISTEMAS</text><text class="sans" x="387.5" y="294" font-size="15" fill="#e6edf3">Webhooks, Sockets</text><text class="sans" x="387.5" y="315" font-size="15" fill="#e6edf3">e arquiteturas</text><text class="sans" x="387.5" y="336" font-size="15" fill="#e6edf3">multi-serviços</text></g><g class="up" style="animation-delay:1.11s"><rect x="543.2" y="232" width="157" height="118" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="559.2" y="264" font-size="12" letter-spacing="2" fill="#ff4b3e">CLAUDE</text><text class="sans" x="559.2" y="294" font-size="15" fill="#e6edf3">Desenvolvimento e</text><text class="sans" x="559.2" y="315" font-size="15" fill="#e6edf3">design com IA</text></g><g class="up" style="animation-delay:1.18s"><rect x="715.0" y="232" width="157" height="118" rx="10" fill="#161b22" stroke="#30363d"/><text class="mono" x="731.0" y="264" font-size="12" letter-spacing="2" fill="#ff4b3e">FRONTEND</text><text class="sans" x="731.0" y="294" font-size="15" fill="#e6edf3">Sites com efeitos</text><text class="sans" x="731.0" y="315" font-size="15" fill="#e6edf3">parallax</text></g></g></svg>
